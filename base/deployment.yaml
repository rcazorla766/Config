apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-house-predictor
  labels:
    app.kubernetes.io/name: ai-house-predictor
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: mlops-tfm
    app.kubernetes.io/version: "1.0.0"
  annotations:
    kubernetes.io/description: "MLOps inference API for California Housing price prediction"
    config.kubernetes.io/origin: "kustomize/base"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-house-predictor
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-house-predictor
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: mlops-tfm
        app.kubernetes.io/version: "1.0.0"
      annotations:
        prometheus.io/scrape: "false"
        config.kubernetes.io/origin: "kustomize/base"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ai-house-predictor:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: ai-house-predictor-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
