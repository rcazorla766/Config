# Plantilla de Secret para credenciales futuras.
# NO aplicar este archivo directamente en el clúster.
# Copiar a secret.yaml, rellenar valores reales y gestionar con Sealed Secrets
# o External Secrets Operator en la fase GitOps.
#
# kubectl create secret generic ai-house-predictor-secrets \
#   --from-literal=MLFLOW_TRACKING_URI=https://mlflow.example.com \
#   --from-literal=MLFLOW_TRACKING_TOKEN=changeme \
#   --namespace mlops-house-predictor
#
apiVersion: v1
kind: Secret
metadata:
  name: ai-house-predictor-secrets
  labels:
    app.kubernetes.io/name: ai-house-predictor
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: mlops-tfm
type: Opaque
stringData:
  MLFLOW_TRACKING_URI: "https://mlflow.example.com"
  MLFLOW_TRACKING_TOKEN: "REPLACE_ME"
  API_KEY: "REPLACE_ME"
