apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: mlops-tfm
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: mlops-tfm
spec:
  description: MLOps TFM production workloads
  sourceRepos:
    - https://github.com/rcazorla766/Config.git
  destinations:
    - namespace: mlops-house-predictor-prod
      server: https://kubernetes.default.svc
    - namespace: mlops-house-predictor-dev
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
